# Avvia tutti i servizi di Tono dalla cartella principale del progetto:
#   cp .env.db.example .env.db      (poi cambia le password: solo lettere e cifre)
#   docker compose up -d --build
# App su http://localhost:3000. I servizi sono definiti in deploy/raspberry/docker-compose.yml (lo stesso file usato
# sul Raspberry); le password arrivano da .env.db.
name: tonecraft

include:
  - path: deploy/raspberry/docker-compose.yml
    env_file: .env.db
